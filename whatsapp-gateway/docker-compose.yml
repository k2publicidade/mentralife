services:
  mentra-whatsapp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PANEL_LOOPBACK_ONLY: "1"
      DATA_DIR: /app/data
    volumes:
      - mentra-whatsapp-data:/app/data
    ports:
      # Painel local visível apenas dentro do servidor. O QR Code aparece no painel /admin da Mentra.
      - "127.0.0.1:3000:3000"
volumes:
  mentra-whatsapp-data:
